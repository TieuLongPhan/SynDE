name: synde
variables:
  SYNDE_VERSION: "0.5.0"
channels:
  - conda-forge
  - defaults
dependencies:
  # Versions used for the committed publication records.
  - python=3.11.15
  - rdkit=2025.9.6
  - numpy=2.4.6
  - pandas=3.0.3
  - matplotlib=3.11.0
  # Optional empirical and semiempirical research backends
  - thermo=0.6.1
  - xtb=6.7.1
  - git-lfs
  # Experiment and calibration dependencies
  - joblib=1.5.3
  - scikit-learn=1.9.0
  - scipy=1.17.1
  - pip
  - pip:
      - chemprop==2.3.0
      - torch==2.13.0
      - ord-schema==0.8.0
      - synkit==1.6.1
      - tblite==0.7.0
  # Development and documentation toolchain
  - pytest
  - black
  - flake8
  - sphinx>=6.0
  - sphinx-rtd-theme
  - sphinxcontrib-bibtex
  - sphinx-copybutton

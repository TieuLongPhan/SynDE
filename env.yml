name: synde
variables:
  SYNDE_VERSION: "0.2.0"
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - rdkit>=2025.3.1
  - numpy>=2.2.0
  - synkit>=1.5,<1.7
  # Optional empirical and semiempirical research backends
  - thermo>=0.6,<0.7
  - tblite-python>=0.7,<0.8
  - xtb=6.7.1
  # Benchmark and calibration dependencies
  - joblib>=1.4,<2
  - scikit-learn>=1.7,<2
  - scipy>=1.15,<2
  # Development and documentation toolchain
  - pytest
  - black
  - flake8
  - sphinx>=6.0
  - sphinx-rtd-theme
  - sphinxcontrib-bibtex
  - sphinx-copybutton
